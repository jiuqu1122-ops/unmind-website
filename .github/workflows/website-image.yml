name: Build website image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
            NEXT_PUBLIC_DOWNLOAD_URL=${{ vars.NEXT_PUBLIC_DOWNLOAD_URL }}
            NEXT_PUBLIC_MOBILE_DOWNLOAD_URL=${{ vars.NEXT_PUBLIC_MOBILE_DOWNLOAD_URL || 'https://api.unmind.art/v1/mobile/apk' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.unmind.art' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
