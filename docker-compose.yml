name: unmind-website

services:
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/jiuqu1122-ops/unmind-website:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - inspiration_backend
    security_opt:
      - no-new-privileges:true

networks:
  inspiration_backend:
    external: true
    name: inspiration_backend
