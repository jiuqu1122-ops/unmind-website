server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Cached pages/bookmarks may still use this path. Only the redirect passes
    # through the website; COS serves the video bytes and Range requests.
    location = /inspiration-drawer-tutorial.mp4 {
        add_header Cache-Control "public, max-age=300" always;
        return 302 https://inspirationdrawer-1475663212.cos.ap-singapore.myqcloud.com/website/tutorials/be07f0efa479d062/inspiration-drawer-tutorial.mp4;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, max-age=0" always;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|ico|webp|jpg|jpeg|gif|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
